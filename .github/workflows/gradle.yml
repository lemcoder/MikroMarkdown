name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jvm
            tasks: ":library:jvmTest"
            os: ubuntu-latest
          - name: android
            tasks: ":library:testAndroidHostTest"
            os: ubuntu-latest
          # The native target and the pdfium bindings are built against the mac-arm64 pdfium, so both
          # legs need a macOS runner. Without this job the native source sets are never even compiled.
          - name: native and pdfium
            tasks: ":library:macosArm64Test :pdfium:jvmTest"
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run tests
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ${{ matrix.tasks }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Formatting and static analysis
        run: ./gradlew ktfmtCheck detekt
